function waterFields(){return `<div class="card"><h2>오늘 마신 물</h2><div class="muted">1컵 = 120mL 기준으로 기록해요.</div><div class="counter"><button onclick="water(-1)" aria-label="한 컵 줄이기">−</button><strong style="font-size:25px">${entry.waterCups==null?'미기록':entry.waterCups+'컵'}</strong><button onclick="water(1)" aria-label="한 컵 더하기">＋</button></div><div class="muted" style="text-align:center">${waterLabel(entry)}</div><div style="text-align:center;margin-top:9px"><button class="back" onclick="waterZero()">0컵 기록하기</button></div></div>`}
function waterLabel(e){if(e.waterCups==null)return '마신 만큼 편하게 더해주세요.';return e.waterCupMl===120?`${e.waterCups*120}mL · 120mL 컵 기준 환산`:'이전 기록 · 컵 용량 미지정 (수정 시 120mL 기준 적용)'}

function mealFields(){return `<section class="meal-book" aria-labelledby="meal-title"><div class="meal-heading"><div><span class="eyebrow">THE DAILY TABLE</span><h2 id="meal-title">오늘의 식탁</h2></div><span class="meal-symbol" aria-hidden="true">◒</span></div><p class="muted">아침부터 저녁까지, 한 곳에 모아 기록해요.<br>빈칸은 ‘먹지 않음’이 아닌 ‘미기록’으로 남겨요.</p>${MEALS.map(([key,label],i)=>{let m=entry.meals[key]||{};return `<section class="meal-entry"><h3><span class="meal-number">0${i+1}</span>${label}식사</h3><div class="field"><label class="entry-label" for="meal-${key}">먹은 음식</label><input id="meal-${key}" data-meal="${key}" data-prop="name" value="${esc(m.name||'')}" placeholder="예: 밥, 된장국, 나물"></div><div class="field"><label class="entry-label" for="note-${key}">짧은 메모</label><input id="note-${key}" data-meal="${key}" data-prop="note" value="${esc(m.note||'')}" placeholder="맛이나 양, 식사하면서 느낀 점"></div>${m.photo?`<img class="photo" src="${esc(m.photo)}" alt="${label} 식사 사진">`:''}<div class="photoactions"><label class="button secondary" for="gallery-${key}">사진 ${m.photo?'바꾸기':'추가'}</label><input hidden type="file" id="gallery-${key}" accept="image/*" data-photo="${key}"><label class="button ghost" for="camera-${key}">카메라</label><input hidden type="file" id="camera-${key}" accept="image/*" capture="environment" data-photo="${key}"></div>${m.photo?`<div class="space">${btn('사진 제거',`removePhoto('${key}')`,'button ghost full')}</div>`:''}</section>`}).join('')}<section class="meal-entry"><h3>오늘 채소를 곁들였나요?</h3><div class="wrap">${['예','아니요','잘 모르겠어요'].map(v=>`<button class="chip ${entry.vegetables===v?'on':''}" onclick="setVegetables('${v}')" aria-pressed="${entry.vegetables===v}">${v}</button>`).join('')}${btn('선택 해제',"setVegetables('')",'chip')}</div><p class="muted">선택 사항이에요. 사진·메뉴명으로 영양 섭취량을 추정하지 않아요.<br>사진은 기기에 저장돼요. 촬영 시 카메라 접근을 허용해 주세요.</p></section>${entry.answers.food||entry.answers.meals?`<section class="meal-entry"><h3>이전 식사 기록</h3><p>${esc(entry.answers.food||'')} ${entry.answers.meals?esc(entry.answers.meals)+'회 (이전 형식)':''}</p></section>`:''}</section>`}
function setVegetables(v){entry.vegetables=v;draft();render()}

function check(){let picked=QUESTIONS.filter(q=>state.selected[state.mode].includes(q.id)&&!['mood','water','food','sleep','caffeine','alcohol_status'].includes(q.id));return `${btn('‹ 일기로 돌아가기',"move('write')",'back')}<div class="muted">${date} · 2 / 2</div><h1>건강 정보를 확인해요</h1><div class="muted">모든 질문은 선택 사항이에요.</div><div class="card"><h2>${MODES[state.mode].title}</h2><div class="muted">내가 선택한 질문 ${state.selected[state.mode].length}개</div><div class="space">${btn('질문 추가 · 선택 변경',"move('questions')",'button secondary full')}</div></div>${moodFields()}${waterFields()}${mealFields()}${state.selected[state.mode].includes('sleep')?sleepField():''}${consumptionField('caffeine')}${consumptionField('alcohol')}<h2>나에게 필요한 질문</h2>${picked.map(q=>`<div class="card"><label class="label" for="q-${q.id}">${esc(q.label)}</label><div class="muted">${esc(q.category)} · 추천 중요도 ${q.importance}/5</div>${q.options.length?`<div class="wrap space">${q.options.map(o=>`<button class="chip ${valueQuestion(q)===o?'on':''}" onclick="setAnswer('${q.id}',decodeURIComponent('${encodeURIComponent(o)}'))">${esc(o)}</button>`).join('')}</div>`:''}<input class="space" id="q-${q.id}" data-question="${q.id}" value="${esc(valueQuestion(q))}" placeholder="답변 입력 · 건너뛰기 가능" ${q.type==='number'?'inputmode="decimal"':''}></div>`).join('')}${btn('오늘의 기록 저장하기',"saveEntry()",'button full')}<div class="space">${btn('일기 다시 보기',"move('write')",'button secondary full')}</div>`}
function questions(){let list=state.selected[state.mode];return `${btn('‹ 돌아가기',"move('check')",'back')}<h1>나의 질문 설정</h1><div class="muted">질문 중요도는 추천을 위한 초기값이며 의학적 점수가 아니에요. 모든 답변은 선택 사항이에요.</div><div class="card"><h2>기록 모드</h2>${modes()}</div><div class="row"><h2>선택한 질문 ${list.length}개</h2>${btn('추천 초기화',"resetQuestions()",'button ghost')}</div><div class="wrap">${CATS.map(c=>`<button class="chip ${category===c?'on':''}" onclick="setCategory(decodeURIComponent('${encodeURIComponent(c)}'))">${esc(c)}</button>`).join('')}</div>${QUESTIONS.filter(q=>q.category===category).map(q=>`<div class="card row"><div><div class="label">${esc(q.label)}</div><div class="muted">추천 중요도 ${q.importance}/5</div></div><button class="chip ${list.includes(q.id)?'on':''}" onclick="toggleQuestion('${q.id}')">${list.includes(q.id)?'선택됨':'추가'}</button></div>`).join('')}${btn('선택 완료',"move('check')",'button full')}`}
function originalSummary(e){let facts=[],good=[],watch=[],suggest=[];let a=e.answers||{};let sp=sleepParts(e);if(sleepTotal(e)!==null)facts.push(`수면 ${sp.hours}시간 ${sp.minutes}분`);for(const [key,label] of [['caffeine','카페인'],['alcohol','술']]){const c=e.consumption?.[key];if(c?.status)facts.push(`${label}: ${c.status==='아니요'?'섭취하지 않음':c.amount?'섭취 · '+c.amount:'섭취 · 양 미기록'}`)}if(a.caffeine)facts.push(`이전 카페인·술 통합 기록: ${a.caffeine}`);if(a.activity)facts.push(`활동 ${a.activity}분`);if(e.waterCups!=null)facts.push(`물 ${e.waterCups}컵`);let mood=MOODS.find(x=>x[0]===e.mood);if(mood)facts.push(`기분 ${mood[0]} ${mood[1]}${e.moodNote?' · '+e.moodNote:''}`);for(const [k,label] of MEALS){let m=e.meals?.[k];if(m&&(m.name||m.note||m.photo))facts.push(`${label}식사: ${[m.name,m.note,m.photo?'사진 첨부':''].filter(Boolean).join(' · ')}`)}if(a.pain)facts.push(`통증·불편: ${a.pain}`);if(a.fatigue)facts.push(`피로: ${a.fatigue}/5`);if(e.diary||facts.length)good.push('오늘의 상태를 기록하며 나를 살펴봤어요.');if(Number(a.activity)>0)good.push('오늘 움직인 시간을 기록했어요.');if(MEALS.some(([k])=>e.meals?.[k]?.name))good.push('식사 내용을 구체적으로 기록했어요.');if(!good.length)good.push('입력된 내용이 적어 정리할 수 있는 항목이 부족해요.');if(a.pain&&a.pain!=='없음')watch.push('기록한 불편감의 변화와 지속 여부를 살펴보세요.');if(Number(a.fatigue)>=4)watch.push('피로도가 높게 기록되었어요. 휴식과 컨디션 변화를 살펴보세요.');if(sleepTotal(e)===null||e.waterCups==null||!e.mood)watch.push('수면, 물, 기분 중 기록하지 않은 항목이 있어요.');if(!watch.length)watch.push('기록을 며칠 더 쌓으며 변화를 살펴보세요.');if(state.profile.goals.includes('수면 개선'))suggest.push('수면이 목표라면 잠든 시간과 일어난 뒤 느낌을 기록해 보세요.');if(state.profile.goals.includes('운동 습관'))suggest.push('몸 상태에 맞는 가벼운 움직임을 계획해 보세요.');if(state.profile.goals.includes('식습관 개선'))suggest.push('다음 식사에서 먹은 음식을 간단히 기록해 보세요.');if(!suggest.length)suggest.push('내일도 관심 있는 항목 하나를 부담 없이 기록해 보세요.');return [['오늘의 건강 기록 요약',facts.length?facts:['입력된 건강 항목이 부족해요.']],['잘 실천한 점',good],['관심을 가지고 살펴볼 점',watch],['내일 실천할 수 있는 제안',suggest]]}
function summary(e){
 const facts=originalSummary(e)[0][1],a=e.answers||{},good=[],watch=[],suggest=[],sl=sleepTotal(e);
 const meals=MEALS.filter(([k])=>{const name=String(e.meals?.[k]?.name||'').trim();return name&&!/^(안\s*먹음|안\s*먹었어요|먹지\s*않음|거름|거른|결식|없음|미섭취|공복|건너뜀)$/.test(name)});
 if(meals.length===3)good.push('오늘은 아침·점심·저녁을 모두 챙겨 먹었다고 기록했어요. 세 끼를 돌아보는 좋은 습관이에요.');
 else if(meals.length)good.push(`${meals.map(x=>x[1]).join('·')}에 먹은 음식을 남겼어요. 식사 패턴을 살펴볼 단서가 생겼어요.`);
 if(Number(a.activity)>0)good.push(`오늘 ${a.activity}분 동안 몸을 움직였어요. 몸 상태에 맞춰 움직인 시간을 쌓아가세요.`);
 if(e.vegetables==='예')good.push('오늘 식사에 채소를 곁들였다고 기록했어요. 다음에도 다양한 음식을 함께 챙겨보세요.');
 if(['🙂','😄'].includes(e.mood))good.push(`오늘의 기분을 '${MOODS.find(x=>x[0]===e.mood)[1]}'으로 남겼어요. 기분 좋았던 순간을 기억해 보세요.`);
 if(sl!==null&&sl<7){watch.push(`오늘 수면은 ${Math.floor(sl)}시간 ${Math.round((sl%1)*60)}분이에요. 성인에게 일반적으로 권장되는 하루 7시간 이상보다 짧아요. 연령과 개인 상태에 따라 필요한 수면은 달라요.`);suggest.push('내일 아침 기상 시간을 정한 뒤, 오늘보다 30분 일찍 잠자리에 들 준비를 해보세요.');}
 if(Number(a.fatigue)>=4){watch.push(`피로도가 ${a.fatigue}/5로 높게 기록됐어요. 무리한 활동보다 휴식이 필요한지 살펴보세요.`);suggest.push('내일 일정 중 잠깐 쉬는 시간을 미리 정해두세요.');}
 if(a.pain&&!/^(없음|아니요|아니오|없다|없어요)$/.test(String(a.pain).trim()))watch.push('기록한 통증이 계속되거나 심해지면 의료 전문가에게 상담해 주세요.');
 if(e.vegetables==='아니요'){watch.push('오늘 채소를 곁들이지 않았다고 기록했어요. 하루 기록만으로 영양 부족을 판단할 수는 없어요.');suggest.push('내일 한 끼에는 평소 먹는 메뉴에 채소 반찬 한 가지를 곁들여 보세요.');}
 else if(!e.vegetables||e.vegetables==='잘 모르겠어요')suggest.push('내일 식사에 채소가 포함됐는지 한 번 살펴보세요. 현재 기록만으로 채소 섭취가 부족한지는 알 수 없어요.');
 if(sl!==null&&sl<7&&Number(a.fatigue)>=4)watch.push('오늘은 짧은 수면과 높은 피로가 함께 기록됐어요. 하루 기록으로 둘의 인과관계를 알 수는 없으니 며칠 더 함께 살펴봐요.');
 if(e.waterCups!=null){const i=facts.findIndex(x=>x.startsWith('물 '));if(i>=0)facts[i]=`물 ${e.waterCups}컵 · ${waterLabel(e)}`;}
 if(sl===null)watch.push('수면시간이 없어 수면에 관한 피드백은 아직 어려워요.');
 if(meals.length<3)watch.push(`음식 이름이 기록된 식사는 ${meals.length}개예요. 비어 있는 끼니를 거른 것으로 판단하지 않아요.`);
 if(!good.length)good.push(e.diary?'오늘의 이야기를 남겼어요. 구체적인 실천 피드백을 위해 체크리스트도 조금 채워보세요.':'잘 실천한 점을 살펴보기에는 기록이 부족해요.');
 if(!watch.length)watch.push('현재 기록에서 추가로 짚을 항목은 없어요. 이것이 건강에 문제가 없다는 뜻은 아니에요.');
 if(state.profile.goals.includes('운동 습관')&&!Number(a.activity))suggest.push('운동 습관이 목표라면 컨디션에 맞는 짧은 산책을 일정에 넣어보세요.');
 return [['오늘의 건강 기록 요약',facts],['잘 실천한 점',good],['관심을 가지고 살펴볼 점',watch],['내일 실천할 수 있는 제안',suggest.slice(0,3)]];
}
function summaryPage(){let e=state.entries[date];return `<div class="journal-date">${date}　/　DAILY REFLECTION</div><h1>오늘의 나에게<br>건네는 작은 피드백.</h1><div class="notice">기본 기록 분석 · 입력값에 따른 규칙 기반 피드백이에요.<br>질병 진단이나 치료를 위한 내용은 아니에요.</div>${e?`<div class="reflections">${summary(e).map(([title,lines])=>`<section class="feedback"><h2>${title}</h2>${lines.map(x=>`<p>${esc(x)}</p>`).join('')}</section>`).join('')}</div><section class="card"><h2>Claude와 조금 더 살펴보기</h2><p class="muted">전송할 항목을 먼저 확인한 뒤 요청해요. 사진은 보내지 않아요.</p>${btn('전송 내용 확인 · Claude 분석',"reviewAI('daily')",'button secondary full')}${e.aiFeedback?`<div class="line"></div><span class="eyebrow">CLAUDE · ${esc(e.aiFeedback.createdAt)}</span><div class="ai-text">${esc(e.aiFeedback.text)}</div>`:''}</section>`:'<p>이 날짜에 저장된 기록이 없어요.</p>'}<p class="muted">기록만으로 건강 상태를 확정할 수 없어요. 증상이 심하거나 지속되면 의료 전문가에게 상담해 주세요.<br><a class="link" href="https://www.cdc.gov/sleep/about/index.html" target="_blank" rel="noopener">수면 피드백 참고: CDC 연령별 수면 안내</a></p>${btn('홈으로 돌아가기',"move('home')",'button full')}`}

function profilePage(){let p=state.profile;return `${btn('‹ 돌아가기',"move('settings')",'back')}<div class="muted">나를 위한 작은 정보</div><h1>내 프로필</h1><div class="muted">모든 항목은 선택 사항이에요.</div><div class="card"><div class="field"><label>이름 또는 닉네임</label><input data-profile="name" value="${esc(p.name)}" placeholder="어떻게 불러드릴까요?"></div><div class="field"><label>생년월일 또는 연령대</label><input data-profile="age" value="${esc(p.age)}" placeholder="예: 20대 또는 2000-01-01"></div><div class="profile-grid"><div class="field"><label>키 (cm)</label><input data-profile="height" value="${esc(p.height)}" inputmode="decimal"></div><div class="field"><label>몸무게 (kg)</label><input data-profile="weight" value="${esc(p.weight)}" inputmode="decimal"></div></div></div><div class="card"><h2>건강 목표</h2><div class="wrap">${GOALS.map(x=>`<button class="chip ${p.goals.includes(x)?'on':''}" onclick="toggleProfile('goals',decodeURIComponent('${encodeURIComponent(x)}'))">${x}</button>`).join('')}</div><div class="line"></div><h2>관심 건강 항목</h2><div class="wrap">${INTERESTS.map(x=>`<button class="chip ${p.interests.includes(x)?'on':''}" onclick="toggleProfile('interests',decodeURIComponent('${encodeURIComponent(x)}'))">${x}</button>`).join('')}</div></div><div class="card"><h2>건강 관련 정보</h2><p class="muted">선택 사항이에요. 예: 고혈압, 천식 또는 정기적으로 복용하는 약 이름. 실제 개인정보 대신 가상 데이터로 이용해 주세요.</p><div class="field"><label>기저질환</label><textarea data-profile="conditions" placeholder="기록하고 싶은 기저질환">${esc(p.conditions||'')}</textarea></div><div class="field"><label>정기 복용약</label><textarea data-profile="medications" placeholder="정기적으로 복용하는 약">${esc(p.medications||'')}</textarea></div></div><div class="card"><h2>기타 메모</h2><textarea data-profile="note" placeholder="남기고 싶은 내용을 적어주세요.">${esc(p.note)}</textarea></div>${btn('프로필 저장',"saveProfile()",'button full')}`}
function calendar(){let year=month.getFullYear(),mo=month.getMonth(),offset=new Date(year,mo,1).getDay(),count=new Date(year,mo+1,0).getDate();let cells=Array(offset).fill('<div></div>').join('');for(let d=1;d<=count;d++){let day=dateLocal(new Date(year,mo,d));cells+=`<button class="${state.entries[day]?'mark':''} ${date===day?'selected':''}" onclick="selectDate('${day}')">${d}</button>`}let e=state.entries[date];return `<div class="muted">하루하루 쌓이는 나의 이야기</div><h1>건강 캘린더</h1><div class="card"><div class="row">${btn('‹',"shiftMonth(-1)",'back')}<h2>${year}년 ${mo+1}월</h2>${btn('›',"shiftMonth(1)",'back')}</div><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div class="muted">${x}</div>`).join('')}${cells}</div><p class="muted">색이 있는 날짜는 기록이 있는 날이에요.</p></div><div class="card"><h2>${date} 기록</h2><p class="muted">${e?esc(e.diary||'체크리스트로 기록한 하루'):'아직 저장된 기록이 없어요.'}</p><div class="actions">${btn(e?'기록 수정':'이 날짜 기록하기',`start('${date}')`,'button secondary')}${e?btn('기록 분석',`openSummary('${date}')`,'button ghost'):''}</div>${e?`<div class="space">${btn('이 날짜 기록 삭제',`deleteEntry('${date}')`,'button ghost full danger')}</div>`:''}</div>`}
function periodEntries(days){let d=new Date();d.setDate(d.getDate()-days+1);return Object.values(state.entries).filter(e=>e.date>=dateLocal(d)&&e.date<=today).sort((a,b)=>b.date.localeCompare(a.date))}
function analysis(){let es=periodEntries(reportRange),sleep=es.map(sleepTotal).filter(x=>x!==null),activity=es.map(e=>e.answers.activity).filter(x=>x!==''&&x!=null&&!isNaN(Number(x))).map(Number);return `<div class="muted">기록으로 알아가는 나의 변화</div><h1>건강 분석 · 리포트</h1><div class="wrap">${[7,30].map(n=>`<button class="chip ${reportRange===n?'on':''}" onclick="setRange(${n})">최근 ${n}일</button>`).join('')}</div><div class="card"><h2>기록 요약</h2><p class="muted">최근 ${reportRange}일 중 ${es.length}일 기록 · 입력한 값만 계산해요</p><div class="row"><div><div class="muted">평균 수면 · ${sleep.length}일</div><strong style="font-size:21px">${sleep.length?(sleep.reduce((a,b)=>a+b,0)/sleep.length).toFixed(1)+'시간':'미기록'}</strong></div><div><div class="muted">활동 합계 · ${activity.length}일</div><strong style="font-size:21px">${activity.length?activity.reduce((a,b)=>a+b,0)+'분':'미기록'}</strong></div></div></div><div class="card"><h2>날짜별 기분과 피로</h2>${es.length?es.map(e=>`<p class="muted">${e.date.slice(5)}　${esc(e.mood||'기분 미기록')}　·　피로 ${esc(e.answers.fatigue||'미기록')}</p>`).join(''):'<p class="muted">저장한 기록이 없어요.</p>'}</div><div class="card"><h2>하루 기록 돌아보기</h2><p class="muted">기록을 저장한 날의 입력 내용을 확인해요.</p>${btn('오늘 기록 분석 보기',`openSummary('${today}')`,'button secondary full')}</div><div class="notice">이 화면은 입력값을 계산한 기초 통계예요. AI 진단이 아니며 원인이나 연관성은 분석하지 않아요.</div>`}
function report(){return `<div class="muted">나를 위한 작은 변화</div><h1>건강 리포트</h1><div class="notice">✦ 예시 화면 · 실제 AI 분석 아님<br>AI는 연결되어 있지 않아요.</div><div class="card"><h2>하루 기록 돌아보기</h2><p class="muted">저장한 일기에서 실제 입력한 항목을 정리해 드려요.</p>${btn('오늘 기록 분석 보기',`openSummary('${today}')`,'button secondary full')}</div><div class="card"><h2>기록 예시</h2><p class="muted">일정 기간 수면과 컨디션을 함께 기록하면 나의 변화를 돌아볼 수 있어요.</p></div><div class="notice">이 서비스는 질병 진단이나 치료법을 제공하지 않습니다. 증상이 심하거나 지속되면 의료 전문가와 상담해 주세요.</div>`}
function settings(){return `${aiSettings()}<div class="muted">나에게 맞춰 사용하는 하루온</div><h1>설정</h1><div class="card"><h2>나의 기본정보</h2><p class="muted">목표와 관심 항목을 나에게 맞게 설정해요.</p>${btn('내 프로필 열기',"move('profile')",'button secondary full')}</div><div class="card"><h2>기록 모드와 질문</h2>${modes()}<div class="space">${btn('질문 선택 화면',"move('questions')",'button secondary full')}</div><div class="space">${btn('하루온 대화 열기',"move('chat')",'button secondary full')}</div><div class="space">${btn('기록 활용 동의 철회',"revokeConsent()",'button ghost full')}</div></div><div class="card"><h2>내 데이터</h2><p class="muted">이 브라우저의 저장 공간에만 저장되며 별도로 암호화되지 않아요. 브라우저 데이터를 지우면 사라질 수 있어요.</p>${btn('기록 내보내기 (JSON)',"exportData()",'button secondary full')}<div class="space"><label class="button ghost full" for="import-file">이전 기록 가져오기 (JSON)</label><input hidden type="file" id="import-file" accept="application/json,.json" onchange="importData(this)"></div><div class="space">${btn('모든 데이터 삭제',"deleteAll()",'button ghost full danger')}</div></div><div class="notice">실제 민감한 건강정보는 입력하지 말고 가상 데이터로 체험해 주세요.</div>`}
function suggestions(){let list=['최근 7일간 수면 분석','최근 일주일 건강 기록 요약'];if(Object.values(state.entries).some(e=>e.answers?.fatigue))list.unshift('최근 피로 기록 살펴보기');if(Object.values(state.entries).some(e=>e.answers?.pain))list.unshift('최근 통증 기록 살펴보기');return list.slice(0,4)}
function chat(){return `${btn('‹ 돌아가기',"move('home')",'back')}<div class="muted">기기 내 규칙 기반 요약</div><h1>✦ 하루온 대화</h1><div class="notice">‘기본 답변’은 기기 내 규칙을 사용해요. ‘Claude에게 질문하기’는 전송 내용을 확인한 뒤 실제 AI에 요청해요.</div>${!state.consent?`<div class="card"><h2>기록을 함께 살펴볼까요?</h2><p class="muted">동의하면 이 브라우저의 최근 기록을 사용해 간단한 요약을 만들어요. 외부 전송은 없으며 설정에서 언제든 동의를 철회할 수 있어요.</p>${btn('기록 활용에 동의',"consentChat()",'button full')}</div>`:`<div class="chat">무엇이 궁금한가요? 최근 기록을 함께 살펴봐요.</div><div class="wrap">${suggestions().map(x=>`<button class="chip" onclick="sendChat(decodeURIComponent('${encodeURIComponent(x)}'))">${esc(x)}</button>`).join('')}</div><div id="messages">${state.chat.map(m=>`<div class="chat ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')}</div><div class="row"><input id="chatInput" placeholder="건강 기록에 대해 물어보세요">${btn('기본 답변',"sendChat()")}</div><div class="space">${btn('Claude에게 질문하기',"reviewAI('chat')",'button secondary full')}</div>`}`}
function render(){navRender();let map={home,write,check,questions,summary:summaryPage,profile:profilePage,calendar,analysis,report,settings,chat,aiReview};screen.innerHTML=`<div id="persist-status" class="status">${persistFailed?'저장에 실패했어요. 브라우저 저장 공간과 권한을 확인해 주세요.':''}</div>`+(map[page]||home)();bind()}
function bind(){let d=document.getElementById('diary');if(d)d.addEventListener('input',e=>{entry.diary=e.target.value;draft()});let n=document.getElementById('moodNote');if(n)n.addEventListener('input',e=>{entry.moodNote=e.target.value;draft()});screen.querySelectorAll('[data-meal]').forEach(x=>x.addEventListener('input',e=>{let {meal,prop}=e.target.dataset;entry.meals[meal]={...(entry.meals[meal]||{}),[prop]:e.target.value};draft()}));screen.querySelectorAll('[data-question]').forEach(x=>x.addEventListener('input',e=>{entry.answers[e.target.dataset.question]=e.target.value;draft()}));screen.querySelectorAll('[data-profile]').forEach(x=>x.addEventListener('input',e=>{state.profile[e.target.dataset.profile]=e.target.value;saveSoon()}));screen.querySelectorAll('[data-photo]').forEach(x=>x.addEventListener('change',photoPicked));screen.querySelectorAll('[data-consumption]').forEach(x=>x.addEventListener('input',e=>{let k=e.target.dataset.consumption;entry.consumption={...(entry.consumption||{}),[k]:{...(entry.consumption?.[k]||{}),amount:e.target.value}};draft()}));let sh=document.getElementById('sleep-hours'),sm=document.getElementById('sleep-minutes');if(sh)sh.addEventListener('change',e=>updateSleep('hours',e.target.value));if(sm)sm.addEventListener('change',e=>updateSleep('minutes',e.target.value));let chatInput=document.getElementById('chatInput');if(chatInput)chatInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat()}})}
function setMood(icon){entry.mood=icon;draft();render()}function water(n){entry.waterCups=Math.max(0,(entry.waterCups??0)+n);entry.waterCupMl=120;draft();render()}function waterZero(){entry.waterCups=0;entry.waterCupMl=120;draft();render()}function removePhoto(key){if(entry.meals[key])delete entry.meals[key].photo;draft();render()}function setAnswer(id,v){entry.answers[id]=v;draft();render()}function setCategory(c){category=c;render()}function toggleQuestion(id){let a=state.selected[state.mode];state.selected[state.mode]=a.includes(id)?a.filter(v=>v!==id):[...a,id];saveSoon();render()}function resetQuestions(){state.selected[state.mode]=defaults()[state.mode];saveSoon();render()}function toggleProfile(key,v){let a=state.profile[key];state.profile[key]=a.includes(v)?a.filter(x=>x!==v):[...a,v];saveSoon();render()}
async function photoPicked(e){const file=e.target.files?.[0],key=e.target.dataset.photo;if(!file)return;if(!file.type.startsWith('image/')){alert('사진 파일을 선택해 주세요.');return}try{let uri=await compressImage(file);entry.meals[key]={...(entry.meals[key]||{}),photo:uri};state.drafts[date]=structuredClone(entry);await persist();render()}catch(err){alert('사진을 저장하지 못했어요. 브라우저 권한과 저장 공간을 확인해 주세요.')}}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const image=new Image();image.onerror=()=>reject(new Error('이미지 형식을 읽을 수 없어요'));image.onload=()=>{let scale=Math.min(1,1100/Math.max(image.width,image.height));let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));let ctx=canvas.getContext('2d');if(!ctx){reject(new Error('이미지 처리 실패'));return}ctx.drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.78))};image.src=reader.result};reader.readAsDataURL(file)})}
async function saveEntry(){delete entry.aiFeedback;state.entries[date]=structuredClone(entry);delete state.drafts[date];try{await persist();move('summary')}catch{alert('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.')}}
async function saveProfile(){try{await persist();alert('프로필을 저장했어요.');move('settings')}catch{alert('프로필을 저장하지 못했어요.')}}
function selectDate(d){date=d;render()}function shiftMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);date=dateLocal(new Date(month.getFullYear(),month.getMonth(),1));render()}function openSummary(d){date=d;move('summary')}function setRange(n){reportRange=n;render()}
async function deleteEntry(d){if(!confirm(`${d} 기록을 삭제할까요?`))return;delete state.entries[d];delete state.drafts[d];try{await persist();render()}catch{alert('삭제에 실패했어요.')}}
async function deleteAll(){if(!confirm('모든 기록, 프로필, 사진과 대화를 삭제할까요? 복구할 수 없어요.'))return;state={mode:'balanced',selected:defaults(),profile:{name:'',age:'',height:'',weight:'',goals:[],interests:[],conditions:'',medications:'',note:''},entries:{},drafts:{},chat:[],consent:false};entry=emptyEntry(today);date=today;try{await persist();move('home')}catch{alert('삭제에 실패했어요.')}}
function exportData(){let blob=new Blob([JSON.stringify({format:'haruon-html-v1',exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`haruon-${today}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function consentChat(){state.consent=true;saveSoon();render()}function revokeConsent(){cancelAI();state.aiConsent=false;state.consent=false;saveSoon();alert('기록 활용 동의를 철회했어요. 기존 대화는 전체 데이터 삭제를 통해 지울 수 있어요.')}
function chatReply(q){if(/가슴.*통증|호흡.*곤란|숨.*못|의식.*없|마비/.test(q))return '심각한 위험 신호일 수 있어요. 현재 증상이 있거나 즉각적인 위험이 있다면 119에 연락하거나 응급실의 도움을 받으세요.';let es=periodEntries(7);if(!es.length)return '최근 7일간 저장된 기록이 없어요. 일기와 체크리스트를 기록하면 확인 가능한 내용을 요약해 드릴게요.';let sl=es.map(sleepTotal).filter(x=>x!==null),fat=es.filter(e=>e.answers.fatigue),pain=es.filter(e=>e.answers.pain&&e.answers.pain!=='없음');let focus=/잠|수면/.test(q)?(sl.length?`수면시간은 ${sl.length}일 기록됐고 평균 ${(sl.reduce((a,b)=>a+b,0)/sl.length).toFixed(1)}시간이에요.`:'수면시간 기록이 아직 없어요.'):/피곤|피로/.test(q)?(fat.length?`피로도 기록: ${fat.slice(0,5).map(e=>e.date.slice(5)+' '+e.answers.fatigue+'/5').join(', ')}.`:'피로도 기록이 아직 없어요.'):/통증|두통|아프/.test(q)?(pain.length?`통증 기록: ${pain.slice(0,5).map(e=>e.date.slice(5)+' '+e.answers.pain).join(', ')}.`:'최근 통증 기록이 없어요.'):`수면 ${sl.length}일, 피로 ${fat.length}일, 통증 ${pain.length}일이 기록됐어요.`;return `최근 7일 중 ${es.length}일의 기록을 확인했어요.\n\n${focus}\n\n이 답변은 단순 기록 요약이에요. 기록만으로 원인을 확정할 수 없어요. 증상이 심하거나 지속되면 의료 전문가와 상담해 주세요.`}
function sendChat(text){let i=document.getElementById('chatInput'),q=(text||(i?i.value:'')).trim();if(!q||!state.consent)return;state.chat.push({role:'user',text:q},{role:'assistant',text:chatReply(q)});saveSoon();render();window.scrollTo(0,document.body.scrollHeight)}

let aiPending=null,aiBusy=false,aiError='',aiController=null;
function isLocalServer(){return location.hostname==='127.0.0.1'&&location.port==='4177'&&location.protocol==='http:'}
function aiSettings(){return `<section class="card"><span class="eyebrow">PRIVATE CONNECTION</span><h2>Claude 연결</h2><p class="muted">${isLocalServer()?'로컬 서버 모드예요. 분석 요청 전 전송 내용을 확인해 주세요.':'현재는 기본 분석 모드예요. 제공된 ZIP의 시작 파일로 실행하면 Claude를 연결할 수 있어요.'}<br>API 키는 HTML이나 이 화면에 입력하지 않아요. 실행 창의 숨김 입력으로만 받으며 서버 종료 시 폐기해요.</p><p class="muted">외부 분석 동의: ${state.aiConsent?'동의함':'동의 전'} · 설정에서 언제든 철회할 수 있어요.</p>${btn('외부 분석 동의 철회',"revokeAI()",'button ghost full')}</section>`}
function cleanRecord(e,focus){
 const all=focus==='all';const groups={sleep:['bedtime','wake_time','sleep_quality','sleep_wakeups','morning_fatigue','nap','fatigue','caffeine_time'],food:['meal_time','food','meal_amount','balance','late_meal','bowel','abdominal'],activity:['activity','exercise_type','exercise_intensity','daily_activity','fatigue'],pain:['pain','pain_area','pain_severity','pain_duration','pain_context','pain_change','symptoms','fatigue'],fatigue:['fatigue','fatigue_time','fatigue_rest','activity','exercise_intensity','stress','morning_fatigue']};
 const r={date:e.date,answers:Object.fromEntries(Object.entries(e.answers||{}).filter(([k,v])=>(all||groups[focus]?.includes(k))&&v!==''&&v!=null).map(([k,v])=>[k,String(v).slice(0,600)]))};
 if(all||['sleep','fatigue'].includes(focus))r.sleepHours=sleepTotal(e);
 if(all||focus==='food'){r.meals=Object.fromEntries(MEALS.map(([k])=>[k,{name:String(e.meals?.[k]?.name||'').slice(0,300),note:String(e.meals?.[k]?.note||'').slice(0,300)}]));r.vegetables=e.vegetables||null;}
 if(all){r.water={cups:e.waterCups??null,cupMl:e.waterCupMl===120?120:null};r.mood=e.mood||null;r.moodNote=String(e.moodNote||'').slice(0,300);}
 if(all||['sleep','fatigue'].includes(focus))r.consumption=e.consumption||{};
 return r;
}
function relevantPayload(kind,q){
 let focus='all';if(kind==='chat'){if(/잠|수면/.test(q))focus='sleep';else if(/피곤|피로/.test(q))focus='fatigue';else if(/식사|음식|식습관|채소/.test(q))focus='food';else if(/운동|활동/.test(q))focus='activity';else if(/통증|두통|아프/.test(q))focus='pain';}
 const period=/달|월|30일/.test(q)?30:7;
 const es=kind==='daily'?[state.entries[date]]:periodEntries(period);
 const context=kind==='chat'?state.chat.slice(-4).map(m=>({role:m.role,text:String(m.text).slice(0,800)})):[];
 return {kind,question:q.slice(0,1000),periodDays:kind==='daily'?1:period,focus,records:es.filter(Boolean).map(e=>cleanRecord(e,focus)),goals:state.profile.goals||[],context};
}
function reviewAI(kind){
 if(aiBusy)return;
 if(!isLocalServer()){alert('Claude 연결은 ZIP을 압축 해제한 뒤 시작.cmd로 실행해 주세요. GitHub Pages와 HTML 더블클릭에서는 기본 분석을 사용할 수 있어요.');return;}
 let q=kind==='daily'?'이 날짜의 기록을 네 부분(요약, 잘 실천한 점, 살펴볼 점, 내일 제안)으로 분석해 주세요.':document.getElementById('chatInput')?.value?.trim();
 if(!q){alert('Claude에게 물어볼 내용을 입력해 주세요.');return;}
 const payload=relevantPayload(kind,q);
 if(!payload.records.length&&kind==='daily'){alert('먼저 이 날짜의 기록을 저장해 주세요.');return;}
 if(JSON.stringify(payload).length>22000){alert('선택한 기록이 길어요. 질문에 수면·식사 등 관심 항목을 지정해 범위를 줄여 주세요.');return;}
 aiPending={payload,returnPage:page,date,entrySnapshot:kind==='daily'?JSON.stringify(state.entries[date]):null};aiError='';move('aiReview');
}
function aiReview(){if(!aiPending)return '<p>진행 중인 요청이 없어요.</p>';return `<div class="eyebrow">BEFORE YOU SEND</div><h1>보내기 전에,<br>한 번 확인해 주세요.</h1><p>선택한 기록 ${aiPending.payload.records.length}일과 질문을 Claude 운영사 Anthropic에 전송해 피드백을 받아요.</p><div class="notice">일기 원문, 사진, 이름, 생년월일, 기저질환 및 정기복용약 프로필은 전송하지 않아요. 체크리스트에 직접 적은 민감한 내용은 아래 전송 목록에 포함될 수 있어요.<br>API 사용료가 발생할 수 있어요. 분석은 의료 진단을 대신하지 않아요.</div><details class="card" open><summary>실제로 전송되는 내용</summary><pre class="review-data">${esc(JSON.stringify(aiPending.payload,null,2))}</pre></details><label class="row"><input type="checkbox" id="ai-consent" style="width:22px;min-height:24px" ${state.aiConsent?'checked':''}> 이 내용을 외부 AI 분석에 활용하는 데 동의합니다.</label><p class="status" role="status">${esc(aiError)}</p><div class="stack"><button class="button full" onclick="executeAI()" ${aiBusy?'disabled':''}>${aiBusy?'Claude가 기록을 살펴보고 있어요…':'동의하고 분석 요청'}</button>${btn(aiBusy?'요청 취소':'돌아가기',"cancelAI()",'button ghost full')}</div><p class="muted">설정에서 동의를 철회할 수 있어요. 요청 후 취소해도 이미 전송된 데이터나 발생한 사용료를 회수할 수는 없어요.</p>`}
async function executeAI(){
 if(aiBusy||!aiPending)return;if(!document.getElementById('ai-consent')?.checked){aiError='외부 전송에 동의한 경우에만 요청할 수 있어요.';render();return;}
 const pending=aiPending;state.aiConsent=true;saveSoon();aiBusy=true;aiError='';aiController=new AbortController();const controller=aiController;render();
 const timeout=setTimeout(()=>controller.abort(),65000);
 try{
  const session=await fetch('/api/session',{cache:'no-store',signal:controller.signal});if(!session.ok)throw Error('로컬 서버 연결을 확인해 주세요.');const {token}=await session.json();
  const res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json','X-Haruon-Token':token},body:JSON.stringify(pending.payload),signal:controller.signal});const data=await res.json();if(!res.ok)throw Error(data.error||'분석 요청을 완료하지 못했어요.');
  if(aiPending!==pending||!state.aiConsent)return;
  if(pending.payload.kind==='daily'){
   const target=state.entries[pending.date];if(!target||JSON.stringify(target)!==pending.entrySnapshot)throw Error('요청 중 기록이 바뀌었어요. 다시 분석해 주세요.');
   target.aiFeedback={text:data.text,createdAt:new Date().toLocaleString('ko-KR'),model:data.model};
  }else state.chat.push({role:'user',text:pending.payload.question},{role:'assistant',text:'✦ Claude 분석 · 참고용\n'+data.text});
  await persist();aiPending=null;aiBusy=false;date=pending.date;move(pending.returnPage);
 }catch(e){if(aiPending===pending){aiError=e.name==='AbortError'?'요청 시간이 초과되었어요. 기본 분석은 계속 이용할 수 있어요.':e.message;aiBusy=false;render();}}
 finally{clearTimeout(timeout);if(aiController===controller){aiController=null;aiBusy=false;}}
}
function cancelAI(){const back=aiPending?.returnPage;aiController?.abort();aiController=null;aiPending=null;aiBusy=false;aiError='';if(back)move(back)}
function revokeAI(){cancelAI();state.aiConsent=false;saveSoon();render();alert('외부 분석 동의를 철회했어요. 이후 요청은 다시 동의해야 해요.')}
async function importData(input){
 const file=input.files?.[0];if(!file)return;
 try{
  const raw=JSON.parse(await file.text());
  if(raw.format!=='haruon-html-v1'||!raw.entries||typeof raw.entries!=='object'||Array.isArray(raw.entries))throw Error('하루온에서 내보낸 JSON 파일을 선택해 주세요.');
  if(!confirm('현재 데이터는 유지하고 없는 날짜의 기록과 임시 저장을 가져올까요? 같은 날짜는 현재 기록을 유지하며, 프로필은 비어 있는 항목만 채워요.'))return;
  const merged=structuredClone(state);
  for(const bucket of ['entries','drafts'])for(const [d,e]of Object.entries(raw[bucket]||{})){
   if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!e||typeof e!=='object'||!e.answers||Array.isArray(e.answers)||!e.meals||Array.isArray(e.meals))throw Error('기록 형식이 올바르지 않아요.');
   if(!merged[bucket][d])merged[bucket][d]=normalize(e,d);
  }
  for(const k of Object.keys(merged.profile)){const v=raw.profile?.[k];if(typeof v==='string'&&!merged.profile[k])merged.profile[k]=v;else if(Array.isArray(v)&&Array.isArray(merged.profile[k])&&!merged.profile[k].length)merged.profile[k]=v.filter(x=>typeof x==='string');}
  if(Array.isArray(raw.chat)&&!merged.chat.length)merged.chat=raw.chat.filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.text==='string');
  for(const k of Object.keys(MODES))if(Array.isArray(raw.selected?.[k]))merged.selected[k]=raw.selected[k].filter(id=>QUESTIONS.some(q=>q.id===id));
  if(MODES[raw.mode])merged.mode=raw.mode;
  const previous=state;state=merged;try{await persist();}catch(e){state=previous;throw e;}entry=normalize(state.drafts[date]||state.entries[date],date);render();alert('기록을 가져왔어요. 현재 데이터와 같은 날짜의 기존 기록은 유지했어요.');
 }catch(e){alert('가져오기 실패: '+e.message);}finally{input.value='';}
}

(async()=>{try{db=await openDB();let old=await readDB();if(old){let init=state;state={...init,...old,selected:{...init.selected,...old.selected},profile:{...init.profile,...old.profile}}}for(const bucket of ['entries','drafts'])state[bucket]=Object.fromEntries(Object.entries(state[bucket]||{}).map(([d,e])=>[d,normalize(e,d)]));for(const k of ['goals','interests'])if(!Array.isArray(state.profile[k]))state.profile[k]=[];entry=normalize(state.drafts[today]||state.entries[today],today);render()}catch(e){screen.innerHTML='<div class="card"><h2>저장 공간을 열 수 없어요</h2><p class="muted">브라우저가 로컬 저장을 차단했을 수 있어요. Chrome이나 Edge에서 열고 저장 권한을 확인해 주세요.</p></div>'}})();
</script></body></html>
