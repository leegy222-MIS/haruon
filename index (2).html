function move(p){page=p;render();window.scrollTo(0,0)}
const btn=(label,fn,cls='button')=>`<button type="button" class="${cls}" onclick="${fn}">${label}</button>`;
function navRender(){let tabs=[['home','⌂','홈'],['calendar','▦','캘린더'],['analysis','▥','분석·리포트'],['chat','✧','챗봇'],['settings','⚙','설정']];nav.innerHTML=tabs.map(([p,i,t])=>`<button class="${page===p?'on':''}" onclick="move('${p}')"><span class="icon">${i}</span>${t}</button>`).join('')}
function modes(){return Object.entries(MODES).map(([k,v])=>`<button class="mode ${state.mode===k?'active':''}" onclick="changeMode('${k}')"><strong>${state.mode===k?'●':'○'} ${v.title}</strong><small>${v.desc}</small></button>`).join('')}
function changeMode(m){state.mode=m;saveSoon();render()}
function start(d=today){date=d;entry=normalize(state.drafts[d]||state.entries[d],d);move('write')}
function addToday(){start(today)}
function valueQuestion(q){return entry.answers[q.id]??''}
function sleepParts(e){if(e.sleepParts)return e.sleepParts;const n=e.answers?.sleep;if(n==null||n===''||!Number.isFinite(Number(n))||Number(n)<0)return {hours:'',minutes:''};const total=Math.round(Number(n)*60);return {hours:String(Math.floor(total/60)),minutes:String(total%60)}}
function sleepTotal(e){let p=sleepParts(e);return p.hours===''||p.minutes===''?null:(Number(p.hours)*60+Number(p.minutes))/60}
function sleepField(){let p=sleepParts(entry);const option=(n,selected)=>`<option value="${n}" ${String(n)===String(selected)?'selected':''}>${n}</option>`;return `<div class="card"><h2>오늘 몇 시간 주무셨나요?</h2><div class="muted">시간과 분을 모두 선택해 주세요. 건너뛰어도 괜찮아요.</div><div class="row space"><select id="sleep-hours" aria-label="수면 시간"><option value="">시간 선택</option>${Array.from({length:25},(_,i)=>option(i,p.hours)).join('')}</select><span>시간</span><select id="sleep-minutes" aria-label="수면 분"><option value="">분 선택</option>${Array.from({length:60},(_,i)=>option(i,p.minutes)).join('')}</select><span>분</span></div>${p.hours!==''&&p.minutes===''||p.hours===''&&p.minutes!==''?'<div class="muted space">시간과 분을 모두 선택하면 기록에 반영돼요.</div>':''}</div>`}
function updateSleep(key,val){let parts={...sleepParts(entry),[key]:val};entry.sleepParts=parts;if(parts.hours!==''&&parts.minutes!=='')entry.answers.sleep=String((Number(parts.hours)*60+Number(parts.minutes))/60);draft();render()}
function consumptionField(type){const isCaffeine=type==='caffeine',name=isCaffeine?'카페인':'술',value=entry.consumption?.[type]||{},legacy=isCaffeine&&entry.answers.caffeine;return `<div class="card"><h2>오늘 ${name}을 섭취했나요?</h2><div class="wrap">${['예','아니요'].map(x=>`<button class="chip ${value.status===x?'on':''}" onclick="setConsumption('${type}','${x}')" aria-pressed="${value.status===x}">${x}</button>`).join('')}</div>${value.status==='예'?`<div class="field"><label for="amount-${type}">얼마나 섭취했나요?</label><input id="amount-${type}" data-consumption="${type}" value="${esc(value.amount||'')}" placeholder="${isCaffeine?'예: 커피 2잔':'예: 맥주 1잔'}"></div>`:''}${legacy?`<div class="muted space">이전 통합 기록: ${esc(legacy)}</div>`:''}</div>`}
function setConsumption(type,status){entry.consumption={...(entry.consumption||{}),[type]:{...(entry.consumption?.[type]||{}),status,...(status==='아니요'?{amount:''}:{})}};draft();render()}

function home(){let e=state.entries[today],name=state.profile.name?`${esc(state.profile.name)}님, `:'';return `<div class="muted">${today.replaceAll('-','. ')}</div><h1>${name}오늘도,<br>나를 살피는 시간</h1><div class="muted">하루를 기록하며 내 몸의 이야기를 들어보세요.</div><div class="hero"><div class="eyebrow" style="color:#e8c5a4">TODAY'S JOURNAL ✦</div><h2>오늘 하루는<br>어땠나요?</h2><p>사소한 변화도 괜찮아요.<br>당신의 하루를 편하게 남겨주세요.</p>${btn(e?'오늘 기록 이어보기 →':'오늘의 일기 쓰기 →','addToday()','button full')}</div><div class="row"><h2>오늘의 기록</h2><span class="muted">${e?'기록 완료':'기록 전'}</span></div><div class="card"><div class="row"><div><div class="label">${e?'나를 위한 기록을 남겼어요':'아직 작성된 일기가 없어요'}</div><div class="muted">${e?esc(e.diary||'체크리스트로 기록한 하루'):'일기와 체크리스트로 하루를 돌아봐요.'}</div></div><span style="font-size:27px">🌾</span></div></div><div class="card"><h2>✦ 하루온 대화</h2><p class="muted">나의 기록을 간단히 살펴봐요.</p>${btn('대화 시작하기 →',"move('chat')",'button secondary full')}</div><div class="notice">이 앱은 기기에만 기록을 저장하는 체험용이에요. 실제 건강정보보다 가상 데이터로 이용해 주세요.</div>`}
function write(){return `${btn('‹ 돌아가기',"move('home')",'back')}<div class="muted">${date} · 1 / 2</div><h1>오늘 하루는 어땠나요?</h1><div class="muted">완벽하지 않아도 괜찮아요. 편하게 적어주세요.</div><div class="card"><h2>나의 하루 일기</h2><textarea id="diary" placeholder="오늘의 음식, 움직임, 기분이나 몸의 변화를 자유롭게 적어보세요.">${esc(entry.diary)}</textarea><div class="muted">작성한 내용은 이 브라우저에 임시 저장돼요.</div></div><div class="card"><h2>나에게 맞는 기록 방식</h2>${modes()}</div><div class="notice">체험용 버전으로, 일기를 AI가 자동 분석하지 않아요. 필요한 항목을 직접 입력해 주세요.</div><div class="space">${btn('건강 정보 확인하기 →',"move('check')",'button full')}</div>`}
function moodFields(){return `<div class="card"><h2>오늘의 기분</h2><div class="muted">오늘의 마음과 가까운 표정을 골라주세요.</div><div class="emoji">${MOODS.map(([i,l])=>`<button class="face ${entry.mood===i?'on':''}" onclick="setMood('${i}')" aria-label="${l}" aria-pressed="${entry.mood===i}"><b>${i}</b><small>${l}</small></button>`).join('')}</div><div class="space"><input id="moodNote" value="${esc(entry.moodNote)}" placeholder="기분 메모 · 선택 사항"></div></div>`}
function waterFields(){return `<div class="card"><h2>물 마시기</h2><div class="muted">컵 크기는 사람마다 다를 수 있어요.</div><div class="counter"><button onclick="water(-1)" aria-label="한 컵 줄이기">−</button><strong style="font-size:22px">${entry.waterCups==null?'미기록':entry.waterCups+'컵'}</strong><button onclick="water(1)" aria-label="한 컵 더하기">＋</button></div><div style="text-align:center;margin-top:9px"><button class="back" onclick="waterZero()">0컵 기록하기</button></div></div>`}
function mealFields(){return `<div class="card"><h2>오늘의 식사</h2><div class="muted">비워 두어도 괜찮아요. 사진은 자동으로 분석하지 않아요.</div></div>`+MEALS.map(([key,label])=>{let m=entry.meals[key]||{};return `<div class="card"><h2>${label}식사</h2><div class="field"><input data-meal="${key}" data-prop="name" value="${esc(m.name||'')}" placeholder="먹은 음식 이름"></div><div class="field"><input data-meal="${key}" data-prop="note" value="${esc(m.note||'')}" placeholder="식사 메모 · 선택 사항"></div>${m.photo?`<img class="photo" src="${esc(m.photo)}" alt="${label} 식사 사진">`:''}<div class="photoactions"><label class="button secondary" for="gallery-${key}">앨범에서 선택</label><input hidden type="file" id="gallery-${key}" accept="image/*" data-photo="${key}"><label class="button secondary" for="camera-${key}">카메라로 촬영</label><input hidden type="file" id="camera-${key}" accept="image/*" capture="environment" data-photo="${key}"></div>${m.photo?`<div class="space">${btn('사진 제거',`removePhoto('${key}')`,'button ghost full')}</div>`:''}<div class="muted space">사진은 브라우저에 저장돼요. 카메라 선택지는 기기·브라우저에 따라 달라질 수 있어요.</div></div>`}).join('')}
function check(){let picked=QUESTIONS.filter(q=>state.selected[state.mode].includes(q.id)&&!['mood','water','food','sleep','caffeine','alcohol_status'].includes(q.id));return `${btn('‹ 일기로 돌아가기',"move('write')",'back')}<div class="muted">${date} · 2 / 2</div><h1>건강 정보를 확인해요</h1><div class="muted">모든 질문은 선택 사항이에요.</div><div class="card"><h2>${MODES[state.mode].title}</h2><div class="muted">내가 선택한 질문 ${state.selected[state.mode].length}개</div><div class="space">${btn('질문 추가 · 선택 변경',"move('questions')",'button secondary full')}</div></div>${moodFields()}${waterFields()}${mealFields()}${state.selected[state.mode].includes('sleep')?sleepField():''}${consumptionField('caffeine')}${consumptionField('alcohol')}<h2>나에게 필요한 질문</h2>${picked.map(q=>`<div class="card"><label class="label" for="q-${q.id}">${esc(q.label)}</label><div class="muted">${esc(q.category)} · 추천 중요도 ${q.importance}/5</div>${q.options.length?`<div class="wrap space">${q.options.map(o=>`<button class="chip ${valueQuestion(q)===o?'on':''}" onclick="setAnswer('${q.id}',decodeURIComponent('${encodeURIComponent(o)}'))">${esc(o)}</button>`).join('')}</div>`:''}<input class="space" id="q-${q.id}" data-question="${q.id}" value="${esc(valueQuestion(q))}" placeholder="답변 입력 · 건너뛰기 가능" ${q.type==='number'?'inputmode="decimal"':''}></div>`).join('')}${btn('오늘의 기록 저장하기',"saveEntry()",'button full')}<div class="space">${btn('일기 다시 보기',"move('write')",'button secondary full')}</div>`}
function questions(){let list=state.selected[state.mode];return `${btn('‹ 돌아가기',"move('check')",'back')}<h1>나의 질문 설정</h1><div class="muted">질문 중요도는 추천을 위한 초기값이며 의학적 점수가 아니에요. 모든 답변은 선택 사항이에요.</div><div class="card"><h2>기록 모드</h2>${modes()}</div><div class="row"><h2>선택한 질문 ${list.length}개</h2>${btn('추천 초기화',"resetQuestions()",'button ghost')}</div><div class="wrap">${CATS.map(c=>`<button class="chip ${category===c?'on':''}" onclick="setCategory(decodeURIComponent('${encodeURIComponent(c)}'))">${esc(c)}</button>`).join('')}</div>${QUESTIONS.filter(q=>q.category===category).map(q=>`<div class="card row"><div><div class="label">${esc(q.label)}</div><div class="muted">추천 중요도 ${q.importance}/5</div></div><button class="chip ${list.includes(q.id)?'on':''}" onclick="toggleQuestion('${q.id}')">${list.includes(q.id)?'선택됨':'추가'}</button></div>`).join('')}${btn('선택 완료',"move('check')",'button full')}`}
function summary(e){let facts=[],good=[],watch=[],suggest=[];let a=e.answers||{};let sp=sleepParts(e);if(sleepTotal(e)!==null)facts.push(`수면 ${sp.hours}시간 ${sp.minutes}분`);for(const [key,label] of [['caffeine','카페인'],['alcohol','술']]){const c=e.consumption?.[key];if(c?.status)facts.push(`${label}: ${c.status==='아니요'?'섭취하지 않음':c.amount?'섭취 · '+c.amount:'섭취 · 양 미기록'}`)}if(a.caffeine)facts.push(`이전 카페인·술 통합 기록: ${a.caffeine}`);if(a.activity)facts.push(`활동 ${a.activity}분`);if(e.waterCups!=null)facts.push(`물 ${e.waterCups}컵`);let mood=MOODS.find(x=>x[0]===e.mood);if(mood)facts.push(`기분 ${mood[0]} ${mood[1]}${e.moodNote?' · '+e.moodNote:''}`);for(const [k,label] of MEALS){let m=e.meals?.[k];if(m&&(m.name||m.note||m.photo))facts.push(`${label}식사: ${[m.name,m.note,m.photo?'사진 첨부':''].filter(Boolean).join(' · ')}`)}if(a.pain)facts.push(`통증·불편: ${a.pain}`);if(a.fatigue)facts.push(`피로: ${a.fatigue}/5`);if(e.diary||facts.length)good.push('오늘의 상태를 기록하며 나를 살펴봤어요.');if(Number(a.activity)>0)good.push('오늘 움직인 시간을 기록했어요.');if(MEALS.some(([k])=>e.meals?.[k]?.name))good.push('식사 내용을 구체적으로 기록했어요.');if(!good.length)good.push('입력된 내용이 적어 정리할 수 있는 항목이 부족해요.');if(a.pain&&a.pain!=='없음')watch.push('기록한 불편감의 변화와 지속 여부를 살펴보세요.');if(Number(a.fatigue)>=4)watch.push('피로도가 높게 기록되었어요. 휴식과 컨디션 변화를 살펴보세요.');if(sleepTotal(e)===null||e.waterCups==null||!e.mood)watch.push('수면, 물, 기분 중 기록하지 않은 항목이 있어요.');if(!watch.length)watch.push('기록을 며칠 더 쌓으며 변화를 살펴보세요.');if(state.profile.goals.includes('수면 개선'))suggest.push('수면이 목표라면 잠든 시간과 일어난 뒤 느낌을 기록해 보세요.');if(state.profile.goals.includes('운동 습관'))suggest.push('몸 상태에 맞는 가벼운 움직임을 계획해 보세요.');if(state.profile.goals.includes('식습관 개선'))suggest.push('다음 식사에서 먹은 음식을 간단히 기록해 보세요.');if(!suggest.length)suggest.push('내일도 관심 있는 항목 하나를 부담 없이 기록해 보세요.');return [['오늘의 건강 기록 요약',facts.length?facts:['입력된 건강 항목이 부족해요.']],['잘 실천한 점',good],['관심을 가지고 살펴볼 점',watch],['내일 실천할 수 있는 제안',suggest]]}
function summaryPage(){let e=state.entries[date];return `<div class="muted">${date} · 하루를 돌아보는 시간</div><h1>오늘의 기록을<br>함께 살펴봐요</h1><div class="notice">✦ 체험용 하루 기록 분석<br>AI가 아닌 규칙으로 입력 내용을 정리해요. 진단이나 치료가 아닌 참고용이에요.</div>${e?summary(e).map(([title,lines])=>`<div class="card"><h2>${title}</h2>${lines.map(x=>`<p class="muted" style="color:var(--ink)">• ${esc(x)}</p>`).join('')}</div>`).join(''):'<div class="card muted">저장된 기록이 없어요.</div>'}<p class="muted">심하거나 지속되는 증상은 의료 전문가와 상담해 주세요.</p>${btn('홈으로 돌아가기',"move('home')",'button full')}`}
function profilePage(){let p=state.profile;return `${btn('‹ 돌아가기',"move('settings')",'back')}<div class="muted">나를 위한 작은 정보</div><h1>내 프로필</h1><div class="muted">모든 항목은 선택 사항이에요.</div><div class="card"><div class="field"><label>이름 또는 닉네임</label><input data-profile="name" value="${esc(p.name)}" placeholder="어떻게 불러드릴까요?"></div><div class="field"><label>생년월일 또는 연령대</label><input data-profile="age" value="${esc(p.age)}" placeholder="예: 20대 또는 2000-01-01"></div><div class="profile-grid"><div class="field"><label>키 (cm)</label><input data-profile="height" value="${esc(p.height)}" inputmode="decimal"></div><div class="field"><label>몸무게 (kg)</label><input data-profile="weight" value="${esc(p.weight)}" inputmode="decimal"></div></div></div><div class="card"><h2>건강 목표</h2><div class="wrap">${GOALS.map(x=>`<button class="chip ${p.goals.includes(x)?'on':''}" onclick="toggleProfile('goals',decodeURIComponent('${encodeURIComponent(x)}'))">${x}</button>`).join('')}</div><div class="line"></div><h2>관심 건강 항목</h2><div class="wrap">${INTERESTS.map(x=>`<button class="chip ${p.interests.includes(x)?'on':''}" onclick="toggleProfile('interests',decodeURIComponent('${encodeURIComponent(x)}'))">${x}</button>`).join('')}</div></div><div class="card"><h2>건강 관련 정보</h2><p class="muted">선택 사항이에요. 예: 고혈압, 천식 또는 정기적으로 복용하는 약 이름. 실제 개인정보 대신 가상 데이터로 이용해 주세요.</p><div class="field"><label>기저질환</label><textarea data-profile="conditions" placeholder="기록하고 싶은 기저질환">${esc(p.conditions||'')}</textarea></div><div class="field"><label>정기 복용약</label><textarea data-profile="medications" placeholder="정기적으로 복용하는 약">${esc(p.medications||'')}</textarea></div></div><div class="card"><h2>기타 메모</h2><textarea data-profile="note" placeholder="남기고 싶은 내용을 적어주세요.">${esc(p.note)}</textarea></div>${btn('프로필 저장',"saveProfile()",'button full')}`}
function calendar(){let year=month.getFullYear(),mo=month.getMonth(),offset=new Date(year,mo,1).getDay(),count=new Date(year,mo+1,0).getDate();let cells=Array(offset).fill('<div></div>').join('');for(let d=1;d<=count;d++){let day=dateLocal(new Date(year,mo,d));cells+=`<button class="${state.entries[day]?'mark':''} ${date===day?'selected':''}" onclick="selectDate('${day}')">${d}</button>`}let e=state.entries[date];return `<div class="muted">하루하루 쌓이는 나의 이야기</div><h1>건강 캘린더</h1><div class="card"><div class="row">${btn('‹',"shiftMonth(-1)",'back')}<h2>${year}년 ${mo+1}월</h2>${btn('›',"shiftMonth(1)",'back')}</div><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div class="muted">${x}</div>`).join('')}${cells}</div><p class="muted">색이 있는 날짜는 기록이 있는 날이에요.</p></div><div class="card"><h2>${date} 기록</h2><p class="muted">${e?esc(e.diary||'체크리스트로 기록한 하루'):'아직 저장된 기록이 없어요.'}</p><div class="actions">${btn(e?'기록 수정':'이 날짜 기록하기',`start('${date}')`,'button secondary')}${e?btn('기록 분석',`openSummary('${date}')`,'button ghost'):''}</div>${e?`<div class="space">${btn('이 날짜 기록 삭제',`deleteEntry('${date}')`,'button ghost full danger')}</div>`:''}</div>`}
function periodEntries(days){let d=new Date();d.setDate(d.getDate()-days+1);return Object.values(state.entries).filter(e=>e.date>=dateLocal(d)&&e.date<=today).sort((a,b)=>b.date.localeCompare(a.date))}
function analysis(){let es=periodEntries(reportRange),sleep=es.map(sleepTotal).filter(x=>x!==null),activity=es.map(e=>e.answers.activity).filter(x=>x!==''&&x!=null&&!isNaN(Number(x))).map(Number);return `<div class="muted">기록으로 알아가는 나의 변화</div><h1>건강 분석 · 리포트</h1><div class="wrap">${[7,30].map(n=>`<button class="chip ${reportRange===n?'on':''}" onclick="setRange(${n})">최근 ${n}일</button>`).join('')}</div><div class="card"><h2>기록 요약</h2><p class="muted">최근 ${reportRange}일 중 ${es.length}일 기록 · 입력한 값만 계산해요</p><div class="row"><div><div class="muted">평균 수면 · ${sleep.length}일</div><strong style="font-size:21px">${sleep.length?(sleep.reduce((a,b)=>a+b,0)/sleep.length).toFixed(1)+'시간':'미기록'}</strong></div><div><div class="muted">활동 합계 · ${activity.length}일</div><strong style="font-size:21px">${activity.length?activity.reduce((a,b)=>a+b,0)+'분':'미기록'}</strong></div></div></div><div class="card"><h2>날짜별 기분과 피로</h2>${es.length?es.map(e=>`<p class="muted">${e.date.slice(5)}　${esc(e.mood||'기분 미기록')}　·　피로 ${esc(e.answers.fatigue||'미기록')}</p>`).join(''):'<p class="muted">저장한 기록이 없어요.</p>'}</div><div class="card"><h2>하루 기록 돌아보기</h2><p class="muted">기록을 저장한 날의 입력 내용을 확인해요.</p>${btn('오늘 기록 분석 보기',`openSummary('${today}')`,'button secondary full')}</div><div class="notice">이 화면은 입력값을 계산한 기초 통계예요. AI 진단이 아니며 원인이나 연관성은 분석하지 않아요.</div>`}
function report(){return `<div class="muted">나를 위한 작은 변화</div><h1>건강 리포트</h1><div class="notice">✦ 예시 화면 · 실제 AI 분석 아님<br>AI는 연결되어 있지 않아요.</div><div class="card"><h2>하루 기록 돌아보기</h2><p class="muted">저장한 일기에서 실제 입력한 항목을 정리해 드려요.</p>${btn('오늘 기록 분석 보기',`openSummary('${today}')`,'button secondary full')}</div><div class="card"><h2>기록 예시</h2><p class="muted">일정 기간 수면과 컨디션을 함께 기록하면 나의 변화를 돌아볼 수 있어요.</p></div><div class="notice">이 서비스는 질병 진단이나 치료법을 제공하지 않습니다. 증상이 심하거나 지속되면 의료 전문가와 상담해 주세요.</div>`}
function settings(){return `<div class="muted">나에게 맞춰 사용하는 하루온</div><h1>설정</h1><div class="card"><h2>나의 기본정보</h2><p class="muted">목표와 관심 항목을 나에게 맞게 설정해요.</p>${btn('내 프로필 열기',"move('profile')",'button secondary full')}</div><div class="card"><h2>기록 모드와 질문</h2>${modes()}<div class="space">${btn('질문 선택 화면',"move('questions')",'button secondary full')}</div><div class="space">${btn('하루온 대화 열기',"move('chat')",'button secondary full')}</div><div class="space">${btn('기록 활용 동의 철회',"revokeConsent()",'button ghost full')}</div></div><div class="card"><h2>내 데이터</h2><p class="muted">이 브라우저의 저장 공간에만 저장되며 별도로 암호화되지 않아요. 브라우저 데이터를 지우면 사라질 수 있어요.</p>${btn('기록 내보내기 (JSON)',"exportData()",'button secondary full')}<div class="space">${btn('모든 데이터 삭제',"deleteAll()",'button ghost full danger')}</div></div><div class="notice">실제 민감한 건강정보는 입력하지 말고 가상 데이터로 체험해 주세요.</div>`}
function suggestions(){let list=['최근 7일간 수면 분석','최근 일주일 건강 기록 요약'];if(Object.values(state.entries).some(e=>e.answers?.fatigue))list.unshift('최근 피로 기록 살펴보기');if(Object.values(state.entries).some(e=>e.answers?.pain))list.unshift('최근 통증 기록 살펴보기');return list.slice(0,4)}
function chat(){return `${btn('‹ 돌아가기',"move('home')",'back')}<div class="muted">기기 내 규칙 기반 요약</div><h1>✦ 하루온 대화</h1><div class="notice">AI를 사용하지 않는 체험용 요약이에요. 진단과 원인 분석을 제공하지 않아요.</div>${!state.consent?`<div class="card"><h2>기록을 함께 살펴볼까요?</h2><p class="muted">동의하면 이 브라우저의 최근 기록을 사용해 간단한 요약을 만들어요. 외부 전송은 없으며 설정에서 언제든 동의를 철회할 수 있어요.</p>${btn('기록 활용에 동의',"consentChat()",'button full')}</div>`:`<div class="chat">무엇이 궁금한가요? 최근 기록을 함께 살펴봐요.</div><div class="wrap">${suggestions().map(x=>`<button class="chip" onclick="sendChat(decodeURIComponent('${encodeURIComponent(x)}'))">${esc(x)}</button>`).join('')}</div><div id="messages">${state.chat.map(m=>`<div class="chat ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')}</div><div class="row"><input id="chatInput" placeholder="건강 기록에 대해 물어보세요">${btn('전송',"sendChat()")}</div>`}`}
function render(){navRender();let map={home,write,check,questions,summary:summaryPage,profile:profilePage,calendar,analysis,report,settings,chat};screen.innerHTML=`<div id="persist-status" class="status">${persistFailed?'저장에 실패했어요. 브라우저 저장 공간과 권한을 확인해 주세요.':''}</div>`+(map[page]||home)();bind()}
function bind(){let d=document.getElementById('diary');if(d)d.addEventListener('input',e=>{entry.diary=e.target.value;draft()});let n=document.getElementById('moodNote');if(n)n.addEventListener('input',e=>{entry.moodNote=e.target.value;draft()});screen.querySelectorAll('[data-meal]').forEach(x=>x.addEventListener('input',e=>{let {meal,prop}=e.target.dataset;entry.meals[meal]={...(entry.meals[meal]||{}),[prop]:e.target.value};draft()}));screen.querySelectorAll('[data-question]').forEach(x=>x.addEventListener('input',e=>{entry.answers[e.target.dataset.question]=e.target.value;draft()}));screen.querySelectorAll('[data-profile]').forEach(x=>x.addEventListener('input',e=>{state.profile[e.target.dataset.profile]=e.target.value;saveSoon()}));screen.querySelectorAll('[data-photo]').forEach(x=>x.addEventListener('change',photoPicked));screen.querySelectorAll('[data-consumption]').forEach(x=>x.addEventListener('input',e=>{let k=e.target.dataset.consumption;entry.consumption={...(entry.consumption||{}),[k]:{...(entry.consumption?.[k]||{}),amount:e.target.value}};draft()}));let sh=document.getElementById('sleep-hours'),sm=document.getElementById('sleep-minutes');if(sh)sh.addEventListener('change',e=>updateSleep('hours',e.target.value));if(sm)sm.addEventListener('change',e=>updateSleep('minutes',e.target.value));let chatInput=document.getElementById('chatInput');if(chatInput)chatInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat()}})}
function setMood(icon){entry.mood=icon;draft();render()}function water(n){entry.waterCups=Math.max(0,(entry.waterCups??0)+n);draft();render()}function waterZero(){entry.waterCups=0;draft();render()}function removePhoto(key){if(entry.meals[key])delete entry.meals[key].photo;draft();render()}function setAnswer(id,v){entry.answers[id]=v;draft();render()}function setCategory(c){category=c;render()}function toggleQuestion(id){let a=state.selected[state.mode];state.selected[state.mode]=a.includes(id)?a.filter(v=>v!==id):[...a,id];saveSoon();render()}function resetQuestions(){state.selected[state.mode]=defaults()[state.mode];saveSoon();render()}function toggleProfile(key,v){let a=state.profile[key];state.profile[key]=a.includes(v)?a.filter(x=>x!==v):[...a,v];saveSoon();render()}
async function photoPicked(e){const file=e.target.files?.[0],key=e.target.dataset.photo;if(!file)return;if(!file.type.startsWith('image/')){alert('사진 파일을 선택해 주세요.');return}try{let uri=await compressImage(file);entry.meals[key]={...(entry.meals[key]||{}),photo:uri};state.drafts[date]=structuredClone(entry);await persist();render()}catch(err){alert('사진을 저장하지 못했어요. 브라우저 권한과 저장 공간을 확인해 주세요.')}}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const image=new Image();image.onerror=()=>reject(new Error('이미지 형식을 읽을 수 없어요'));image.onload=()=>{let scale=Math.min(1,1100/Math.max(image.width,image.height));let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));let ctx=canvas.getContext('2d');if(!ctx){reject(new Error('이미지 처리 실패'));return}ctx.drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.78))};image.src=reader.result};reader.readAsDataURL(file)})}
async function saveEntry(){state.entries[date]=structuredClone(entry);delete state.drafts[date];try{await persist();move('summary')}catch{alert('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.')}}
async function saveProfile(){try{await persist();alert('프로필을 저장했어요.');move('settings')}catch{alert('프로필을 저장하지 못했어요.')}}
function selectDate(d){date=d;render()}function shiftMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);date=dateLocal(new Date(month.getFullYear(),month.getMonth(),1));render()}function openSummary(d){date=d;move('summary')}function setRange(n){reportRange=n;render()}
async function deleteEntry(d){if(!confirm(`${d} 기록을 삭제할까요?`))return;delete state.entries[d];delete state.drafts[d];try{await persist();render()}catch{alert('삭제에 실패했어요.')}}
async function deleteAll(){if(!confirm('모든 기록, 프로필, 사진과 대화를 삭제할까요? 복구할 수 없어요.'))return;state={mode:'balanced',selected:defaults(),profile:{name:'',age:'',height:'',weight:'',goals:[],interests:[],conditions:'',medications:'',note:''},entries:{},drafts:{},chat:[],consent:false};entry=emptyEntry(today);date=today;try{await persist();move('home')}catch{alert('삭제에 실패했어요.')}}
function exportData(){let blob=new Blob([JSON.stringify({format:'haruon-html-v1',exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`haruon-${today}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function consentChat(){state.consent=true;saveSoon();render()}function revokeConsent(){state.consent=false;saveSoon();alert('기록 활용 동의를 철회했어요. 기존 대화는 전체 데이터 삭제를 통해 지울 수 있어요.')}
function chatReply(q){if(/가슴.*통증|호흡.*곤란|숨.*못|의식.*없|마비/.test(q))return '심각한 위험 신호일 수 있어요. 현재 증상이 있거나 즉각적인 위험이 있다면 119에 연락하거나 응급실의 도움을 받으세요.';let es=periodEntries(7);if(!es.length)return '최근 7일간 저장된 기록이 없어요. 일기와 체크리스트를 기록하면 확인 가능한 내용을 요약해 드릴게요.';let sl=es.map(sleepTotal).filter(x=>x!==null),fat=es.filter(e=>e.answers.fatigue),pain=es.filter(e=>e.answers.pain&&e.answers.pain!=='없음');let focus=/잠|수면/.test(q)?(sl.length?`수면시간은 ${sl.length}일 기록됐고 평균 ${(sl.reduce((a,b)=>a+b,0)/sl.length).toFixed(1)}시간이에요.`:'수면시간 기록이 아직 없어요.'):/피곤|피로/.test(q)?(fat.length?`피로도 기록: ${fat.slice(0,5).map(e=>e.date.slice(5)+' '+e.answers.fatigue+'/5').join(', ')}.`:'피로도 기록이 아직 없어요.'):/통증|두통|아프/.test(q)?(pain.length?`통증 기록: ${pain.slice(0,5).map(e=>e.date.slice(5)+' '+e.answers.pain).join(', ')}.`:'최근 통증 기록이 없어요.'):`수면 ${sl.length}일, 피로 ${fat.length}일, 통증 ${pain.length}일이 기록됐어요.`;return `최근 7일 중 ${es.length}일의 기록을 확인했어요.\n\n${focus}\n\n이 답변은 단순 기록 요약이에요. 기록만으로 원인을 확정할 수 없어요. 증상이 심하거나 지속되면 의료 전문가와 상담해 주세요.`}
function sendChat(text){let i=document.getElementById('chatInput'),q=(text||(i?i.value:'')).trim();if(!q||!state.consent)return;state.chat.push({role:'user',text:q},{role:'assistant',text:chatReply(q)});saveSoon();render();window.scrollTo(0,document.body.scrollHeight)}
(async()=>{try{db=await openDB();let old=await readDB();if(old){let init=state;state={...init,...old,selected:{...init.selected,...old.selected},profile:{...init.profile,...old.profile}}}entry=normalize(state.drafts[today]||state.entries[today],today);render()}catch(e){screen.innerHTML='<div class="card"><h2>저장 공간을 열 수 없어요</h2><p class="muted">브라우저가 로컬 저장을 차단했을 수 있어요. Chrome이나 Edge에서 열고 저장 권한을 확인해 주세요.</p></div>'}})();
</script></body></html>
